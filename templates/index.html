<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ profile.name }} | Links</title>
  <meta name="description" content="{{ profile.name }} - all my links in one place.">
  <meta property="og:title" content="{{ profile.name }}">
  <meta property="og:description" content="{{ profile.tagline }}">
  <meta property="og:image" content="{{ url_for('static', filename=profile.image, _external=True) }}">
  <link rel="icon" href="{{ url_for('static', filename=profile.image) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% set ICONS = {
    'tiktok': '<path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.7V9.1a7.4 7.4 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6z"/>',
    'instagram': '<path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2zm-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6zm9.65 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>',
    'youtube': '<path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3L10 15z"/>',
    'globe': '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 9h-3.2a15.7 15.7 0 0 0-1.3-6A8 8 0 0 1 18.9 11zM12 4c.8 1 1.9 3.1 2.3 7H9.7C10.1 7.1 11.2 5 12 4zM4.3 13h3.2a15.7 15.7 0 0 0 1.3 6A8 8 0 0 1 4.3 13zm3.2-2H4.3a8 8 0 0 1 4.5-6 15.7 15.7 0 0 0-1.3 6zM12 20c-.8-1-1.9-3.1-2.3-7h4.6c-.4 3.9-1.5 6-2.3 7zm3.2-1a15.7 15.7 0 0 0 1.3-6h3.2a8 8 0 0 1-4.5 6z"/>'
  } %}
  <main class="card">
    <div class="avatar">
      <img src="{{ url_for('static', filename=profile.image) }}" alt="{{ profile.name }}" width="400" height="400">
    </div>
    <h1>{{ profile.name }}</h1>
    <p class="tagline">{{ profile.tagline }}</p>

    <nav class="links" aria-label="Links">
      {% for link in links %}
      <a class="link" href="{{ link.url }}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">{{ ICONS[link.icon]|safe }}</svg>
        <span>{{ link.title }}</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      {% endfor %}
    </nav>
  </main>
</body>
</html>
